version: '3.8'

services:
  dca-bot:
    build: .
    container_name: dca-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot_state.json:/app/bot_state.json
      - ./trade_history.csv:/app/trade_history.csv
      - ./bot.log:/app/bot.log
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
